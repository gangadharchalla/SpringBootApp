server:
  port: 8080

spring:
  application:
    name: equity-service-test

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: false

  h2:
    console:
      enabled: false

  sql:
    init:
      mode: never

jwt:
  secret: dGVzdFNlY3JldEtleUZvckpXVFRva2VuVGVzdGluZ1B1cnBvc2VPbmx5MTIzNA==
  expiration: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info

logging:
  level:
    com.equity.equityservice: DEBUG
